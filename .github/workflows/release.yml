# SPDX-License-Identifier: GPL-3.0-or-later
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            make \
            pkg-config \
            libarchive-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            scdoc \
            zstd

      - name: Build release bundle
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          make clean && make CC=clang -j"$(nproc)"
          llvm-strip --strip-unneeded ./pi
          mkdir -p release
          cp pi release/
          cp -r completions man release/
          tar -czf "pi-${TAG_NAME}.tar.gz" -C release .
          sha256sum "pi-${TAG_NAME}.tar.gz" > "pi-${TAG_NAME}.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" \
            "pi-${TAG_NAME}.tar.gz" \
            "pi-${TAG_NAME}.tar.gz.sha256" \
            --clobber
